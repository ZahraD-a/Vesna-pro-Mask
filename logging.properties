# Agent output goes to Jason's MAS console window.
#
# jason.infra.local.RunLocalMAS inspects the configured handler: when it is
# MASConsoleLogHandler it opens the Swing console AND calls
# MASConsoleGUI.setAsDefaultOut(), which replaces System.out. So with the setting
# below EVERYTHING lands in that window -- the agents' .print output and the
# end-of-run mask report alike -- and the terminal stays quiet. That is expected,
# not a failure.
#
# Because the window dies with the JVM when .stopMAS runs, the report is also
# written to results/mas/report.txt, and alice.asl waits before stopping so there
# is time to read it on screen.
#
# To send everything to the terminal instead (pipeable, diffable, easy to paste
# into an email), swap the handler for:
#
#     handlers = java.util.logging.ConsoleHandler
#
# To get both at once, list both. Note that ConsoleHandler writes to stderr, so it
# survives the setOut hijack and the dialogue appears twice, but the mask report
# is plain System.out and would reach the window only.

handlers = jason.runtime.MASConsoleLogHandler
.level = INFO

jason.runtime.MASConsoleLogHandler.level = ALL
jason.runtime.MASConsoleLogHandler.formatter = jason.runtime.MASConsoleLogFormatter
jason.runtime.MASConsoleLogHandler.tabbed = false
jason.runtime.MASConsoleLogHandler.colors = true

# Used only if java.util.logging.ConsoleHandler is enabled above. Prints
# "[alice] ..." rather than the full jason.asSemantics.TransitionSystem.alice name.
java.util.logging.ConsoleHandler.level = INFO
java.util.logging.ConsoleHandler.formatter = vesna.AgentLogFormatter

# Jason's own defaults: silence the JDK/Jade noise.
java.level = OFF
javax.level = OFF
sun.level = OFF
jade.level = OFF
