# Agent output goes to Jason's MAS console window, not the terminal: Jason replaces
# System.out when MASConsoleLogHandler is the configured handler. The window closes
# with the JVM at .stopMAS, so the end-of-run report is also written to
# results/latest/report.txt.
#
# For terminal output instead, use: handlers = java.util.logging.ConsoleHandler

handlers = java.util.logging.ConsoleHandler
.level = INFO

jason.runtime.MASConsoleLogHandler.level = ALL
jason.runtime.MASConsoleLogHandler.formatter = jason.runtime.MASConsoleLogFormatter
jason.runtime.MASConsoleLogHandler.tabbed = false
jason.runtime.MASConsoleLogHandler.colors = true

java.level = OFF
javax.level = OFF
sun.level = OFF
jade.level = OFF
