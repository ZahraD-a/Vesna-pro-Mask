defaultTasks 'run'

apply plugin: 'java'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    maven { url "https://raw.githubusercontent.com/jacamo-lang/mvn-repo/master" }
    maven { url "https://repo.gradle.org/gradle/libs-releases" }
    mavenCentral()
}

dependencies {
    implementation ('org.jacamo:jacamo:1.2')

    // https://mvnrepository.com/artifact/org.java-websocket/Java-WebSocket
    implementation group: 'org.java-websocket', name: 'Java-WebSocket', version: '1.5.6'
    // https://mvnrepository.com/artifact/org.json/json
    implementation("org.json:json:20230227")

}

task run (type: JavaExec, dependsOn: 'classes') {
    description 'runs the application'
    group ' JaCaMo'
    mainClass = 'jacamo.infra.JaCaMoLauncher'
    args 'vesna.jcm'
    classpath sourceSets.main.runtimeClasspath
    executable = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }.get().executablePath
    standardOutput = System.out
    errorOutput = System.err
    if (project.hasProperty('alpha'))  systemProperty 'alpha',  project.getProperty('alpha')
    if (project.hasProperty('beta'))   systemProperty 'beta',   project.getProperty('beta')
    if (project.hasProperty('gamma'))  systemProperty 'gamma',  project.getProperty('gamma')
}

// Regenerate the figures after every run, so the PNGs in results/latest always match the
// CSVs beside them. Non-fatal: a missing matplotlib should not fail the run.
task plots (type: Exec) {
    description 'redraws results/latest/*.png'
    group ' JaCaMo'
    commandLine 'python', 'scripts/plot_results.py'
    ignoreExitValue = true
}
run.finalizedBy plots

task runEnergy (type: JavaExec, dependsOn: 'classes') {
    description 'runs the non-social energy scenario'
    group ' JaCaMo'
    mainClass = 'jacamo.infra.JaCaMoLauncher'
    args 'vesna_energy.jcm'
    classpath sourceSets.main.runtimeClasspath
    executable = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }.get().executablePath
    standardOutput = System.out
    errorOutput = System.err
}

javadoc {
    destinationDir = file( "$buildDir/docs/javadoc" )
    options.memberLevel = JavadocMemberLevel.PRIVATE
    options.addStringOption( "-add-stylesheet", "styles.css" )
}

sourceSets {
    main {
        java {
            srcDir 'src/'
        }
    }
}

